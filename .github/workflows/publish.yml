name: Publish verified APK

on:
  push:
    branches: ['incoming/**']

permissions:
  contents: write

concurrency:
  group: public-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Validate and publish the APK, then remove the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
